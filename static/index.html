<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stock Alpha Local</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f6f8fa; }
    h1 { margin-bottom: 8px; }
    .bar { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
    input, button { padding: 9px 12px; font-size: 14px; }
    button { cursor: pointer; background: #0969da; color: white; border: 0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #eee; }
    tr:hover { background: #f0f6ff; }
    .card { background: white; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Stock Alpha Local</h1>
  <div class="muted">本地美股筛选系统 MVP</div>

  <div class="bar">
    <button onclick="syncStocks()">同步默认股票池</button>
    <input id="minScore" placeholder="最低评分，例如 50">
    <input id="maxPe" placeholder="最高 PE，例如 40">
    <input id="minGrowth" placeholder="最低营收增长，例如 10">
    <button onclick="loadStocks()">筛选</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>代码</th>
        <th>名称</th>
        <th>价格</th>
        <th>PE</th>
        <th>市值($B)</th>
        <th>营收增长%</th>
        <th>利润率%</th>
        <th>评分</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="card">
    <h2>详情</h2>
    <pre id="detail">点击股票代码查看详情</pre>
  </div>

<script>
async function syncStocks() {
  document.getElementById("rows").innerHTML = "<tr><td colspan='9'>同步中...</td></tr>";
  await fetch("/api/sync", { method: "POST" });
  await loadStocks();
}

function val(id) {
  return document.getElementById(id).value.trim();
}

async function loadStocks() {
  let qs = new URLSearchParams();
  if (val("minScore")) qs.set("min_score", val("minScore"));
  if (val("maxPe")) qs.set("max_pe", val("maxPe"));
  if (val("minGrowth")) qs.set("min_growth", val("minGrowth"));

  let res = await fetch("/api/stocks?" + qs.toString());
  let data = await res.json();
  let html = "";

  for (let s of data) {
    html += `
      <tr>
        <td><a href="#" onclick="detail('${s.ticker}')">${s.ticker}</a></td>
        <td>${s.name || ""}</td>
        <td>${fmt(s.price)}</td>
        <td>${fmt(s.pe)}</td>
        <td>${fmt(s.market_cap)}</td>
        <td>${fmt(s.revenue_growth)}</td>
        <td>${fmt(s.profit_margin)}</td>
        <td><b>${fmt(s.score)}</b></td>
        <td><button onclick="watch('${s.ticker}')">加入自选</button></td>
      </tr>`;
  }

  document.getElementById("rows").innerHTML = html || "<tr><td colspan='9'>暂无数据，请先同步</td></tr>";
}

function fmt(x) {
  if (x === null || x === undefined) return "";
  return Number(x).toFixed(2);
}

async function detail(ticker) {
  let res = await fetch("/api/stocks/" + ticker);
  let data = await res.json();
  document.getElementById("detail").textContent = JSON.stringify(data, null, 2);
}

async function watch(ticker) {
  await fetch("/api/watchlist/" + ticker, { method: "POST" });
  alert(ticker + " 已加入自选");
}

loadStocks();
</script>
</body>
</html>
